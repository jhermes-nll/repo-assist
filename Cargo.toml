[package]
name = "repo-assist"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local, advisory, always-on daemon that watches a git repository (all worktrees) and surfaces agent/plan conflicts, drift, and stalls."
license = "MIT"
repository = "https://github.com/jhermes-nll/repo-assist"

[[bin]]
name = "ra"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
notify = "6"
notify-debouncer-full = "0.3"
ignore = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
