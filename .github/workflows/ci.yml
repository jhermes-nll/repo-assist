# repo-assist — CI

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action@stable
        with:
          toolchain: stable
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
